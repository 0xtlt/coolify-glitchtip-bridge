# Paste this into Server > Log Drains > Custom FluentBit configuration.
# Replace the three REPLACE_* values before enabling it.

[SERVICE]
    Flush             2
    Daemon            Off
    Log_Level         info
    Parsers_File      parsers.conf

[INPUT]
    Name              forward
    Listen            0.0.0.0
    Port              24224
    Buffer_Chunk_Size 1M
    Buffer_Max_Size   6M

[FILTER]
    Name              grep
    Match             *
    Exclude           log ^\s*$
    Exclude           COOLIFY_APP_NAME ^coolify-glitchtip-bridge$

[FILTER]
    Name              modify
    Match             *
    Set               coolify.server_name REPLACE_WITH_COOLIFY_SERVER_NAME
    Rename            COOLIFY_APP_NAME coolify.app_name
    Rename            COOLIFY_PROJECT_NAME coolify.project_name
    Rename            COOLIFY_SERVER_IP coolify.server_ip
    Rename            COOLIFY_ENVIRONMENT_NAME coolify.environment_name

[OUTPUT]
    Name              http
    Match             *
    Host              REPLACE_WITH_BRIDGE_HOSTNAME
    Port              443
    URI               /v1/logs
    Header            Authorization Bearer REPLACE_WITH_AUTH_TOKEN
    Format            json
    Json_Date_Key     timestamp
    Json_Date_Format  iso8601
    Compress          gzip
    Tls               On
    Retry_Limit       False

