[package]
name = "coolify-glitchtip-bridge"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Forward Coolify log drains and webhook failures to GlitchTip"
license = "MIT"
repository = "https://github.com/0xtlt/coolify-glitchtip-bridge"
keywords = ["coolify", "glitchtip", "sentry", "logging", "observability"]
categories = ["web-programming::http-server", "development-tools::debugging"]

[dependencies]
anyhow = "1.0"
axum = "0.8"
bytes = "1.10"
regex = "1.11"
sentry = { version = "0.49.1", default-features = false, features = ["reqwest", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
subtle = "2.6"
tokio = { version = "1.47", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.7", features = ["decompression-gzip", "limit", "sensitive-headers"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
strip = true
